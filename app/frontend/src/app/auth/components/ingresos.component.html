<div class="ingresos-container">
  <div class="header-section">
    <button routerLink="/gestor" class="btn-volver">← Volver al Inicio</button>
    <h2>Gestión de Ingresos</h2>
    <span class="badge-total">Total: Q {{ totalIngresos | number:'1.2-2' }}</span>
  </div>

  <div class="grid-layout">
    <!-- Formulario -->
    <div class="card form-card">
      <h3>Nuevo Ingreso</h3>
      <form (ngSubmit)="guardarIngreso()">
        <div class="form-group">
          <label>Concepto</label>
          <input 
            type="text" 
            [(ngModel)]="nuevoIngreso.titulo" 
            name="titulo" 
            placeholder="Ej. Sueldo, Bono, Venta" 
            required>
        </div>

        <div class="form-group">
          <label>Monto (Q)</label>
          <input 
            type="number" 
            [(ngModel)]="nuevoIngreso.monto" 
            name="monto" 
            placeholder="0.00" 
            step="0.01" 
            min="0.01" 
            required>
        </div>

        <button type="submit" [disabled]="cargando" class="btn-guardar">
          {{ cargando ? 'Guardando...' : '+ Agregar Ingreso' }}
        </button>
      </form>
      <p *ngIf="mensaje" class="alert-msg">{{ mensaje }}</p>
    </div>

    <!-- Historial -->
    <div class="card list-card">
      <h3>Historial de Ingresos</h3>
      <div *ngIf="listaIngresos.length === 0" class="empty-state">
        No tienes ingresos registrados todavía.
      </div>
      <table *ngIf="listaIngresos.length > 0" class="tabla-ingresos">
        <thead>
          <tr>
            <th>Concepto</th>
            <th>Fecha</th>
            <th>Monto</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of listaIngresos">
            <td>{{ item.titulo }}</td>
            <td>{{ item.fecha | date:'shortDate' }}</td>
            <td class="monto-positivo">+ Q {{ item.monto | number:'1.2-2' }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
